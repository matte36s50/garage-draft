name: Catalogue probe

# Reads each auction house's catalogue pages and reports which ones are
# readable, first with a plain fetch as Live Entry's extractor does, then in a
# headless browser (auction-admin/scripts/catalogue-probe*.mjs). Read-only: no
# Claude calls, no writes, no secrets.

on:
  workflow_dispatch:
    inputs:
      houses:
        description: 'Only these houses (space-separated: rm gooding broadarrow bonhams mecum bj); blank for all'
        required: false
        default: ''
  push:
    branches: ['claude/**']
    paths:
      - 'auction-admin/scripts/catalogue-probe*.mjs'
      - 'auction-admin/scripts/probe-lib.mjs'
      - 'auction-admin/lib/pageText.js'
      - '.github/workflows/catalogue-probe.yml'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe catalogue pages (plain fetch)
        working-directory: auction-admin
        env:
          HOUSES: ${{ github.event.inputs.houses }}
        run: node scripts/catalogue-probe.mjs $HOUSES

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # For this run only; Playwright is not an app dependency.
      - name: Install Playwright and Chromium
        working-directory: auction-admin
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Probe catalogue pages (headless browser)
        working-directory: auction-admin
        env:
          HOUSES: ${{ github.event.inputs.houses }}
        run: node scripts/catalogue-probe-browser.mjs $HOUSES
