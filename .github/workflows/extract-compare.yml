name: Extractor comparison

# Reads a catalogue the way the catalogue watch does and runs the same text
# through the extractor once per model setting, then reports every lot where
# they disagree and what each run cost. Use it before changing the extractor's
# default model or effort. Writes nothing to the store; the only side effect is
# the Claude spend shown in the report.
# See auction-admin/scripts/extract-compare.mjs.
#
# Two ways to start it:
#   - Run workflow (manual dispatch) with one catalogue. The report is in the
#     job summary.
#   - Push a change to .github/extract-compare.json on a claude/extract-compare/*
#     branch (Claude sessions can't dispatch workflows). Each entry is one
#     comparison: {"house", "url", "mode", "models"?, "max_lots"?}. The report
#     is also posted as a comment on the pushed commit.

on:
  workflow_dispatch:
    inputs:
      house:
        description: 'House the catalogue belongs to'
        type: choice
        options: [rm, broadarrow, gooding, mecum]
        default: rm
      catalogue_url:
        description: 'Catalogue URL (as the watch reads it)'
        required: true
      mode:
        description: 'estimate (before the sale) or result (after it)'
        type: choice
        options: [result, estimate]
        default: result
      models:
        description: 'Settings to compare (model:effort, or default for what the live extractor runs), comma-separated; the first is the baseline'
        default: 'default,claude-sonnet-5:low'
      max_lots:
        description: 'Lots to send to each setting (a cost cap)'
        default: '100'
  push:
    branches: ['claude/extract-compare/**']
    paths: ['.github/extract-compare.json']

permissions:
  contents: write # only to comment the report on the commit that asked for it

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        working-directory: auction-admin
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Compare
        working-directory: auction-admin
        env:
          CATALOGUE_WATCH_APP_URL: ${{ vars.CATALOGUE_WATCH_APP_URL || 'https://bid-prix-admin.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          COMPARE_REPORT: compare-report.md
          EVENT: ${{ github.event_name }}
          HOUSE: ${{ inputs.house }}
          CATALOGUE_URL: ${{ inputs.catalogue_url }}
          MODE: ${{ inputs.mode }}
          MODELS: ${{ inputs.models }}
          MAX_LOTS: ${{ inputs.max_lots }}
        run: |
          if [ "$EVENT" = push ]; then
            runs=$(jq -c '.[]' ../.github/extract-compare.json)
          else
            runs=$(jq -nc --arg house "$HOUSE" --arg url "$CATALOGUE_URL" --arg mode "$MODE" \
              --arg models "$MODELS" --arg max_lots "$MAX_LOTS" \
              '{house: $house, url: $url, mode: $mode, models: $models, max_lots: $max_lots}')
          fi
          status=0
          while read -r run; do
            node scripts/extract-compare.mjs \
              --house "$(jq -r '.house' <<<"$run")" \
              --url "$(jq -r '.url' <<<"$run")" \
              --mode "$(jq -r '.mode' <<<"$run")" \
              --models "$(jq -r '.models // "default,claude-sonnet-5:low"' <<<"$run")" \
              --max-lots "$(jq -r '.max_lots // 100' <<<"$run")" </dev/null || status=1
          done <<<"$runs"
          exit $status
      - name: Comment the report on the commit
        if: always() && github.event_name == 'push' && hashFiles('auction-admin/compare-report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head -c 60000 auction-admin/compare-report.md > report.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@report.md --silent
